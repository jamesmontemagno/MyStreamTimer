name: Windows Build

# PR / push gate for the Windows (WinUI 3) app. The workflow always runs so the
# required status checks always report; the `changes` job decides whether the
# build and tests actually execute. Keep the same jobs and matrix-expanded
# check names on every run, using Linux for no-op checks on non-Windows changes.
# !cancelled() also expands the matrix after failed or skipped change detection;
# each job rejects unsuccessful or invalid detection instead of reporting a
# successful no-op. Cancellation still stops work. Do not gate expansion on paths.

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, 'winui-*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Windows changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            windows:
              - 'src/**'
              - 'tests/**'
              - 'eng/**'
              - 'MyStreamTimer.slnx'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'nuget.config'
              - '.github/workflows/ci.yml'
              - '.github/workflows/windows-store-publish.yml'
              - '.github/actions/diagnose-partner-center/**'
              - 'scripts/Test-StorePackage.ps1'
              - 'scripts/StoreRelease.ps1'
              - 'scripts/Publish-StorePackage.ps1'
              - 'scripts/Test-StoreRelease.ps1'

  test:
    name: Core tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.windows == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - name: Validate change detection
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_CHANGED: ${{ needs.changes.outputs.windows }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || ! "$WINDOWS_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::Windows change detection did not succeed with a valid result."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.windows == 'true' }}
      - uses: actions/setup-dotnet@v5
        if: ${{ needs.changes.outputs.windows == 'true' }}
        with:
          dotnet-version: 10.0.x
      - name: Restore
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: dotnet restore MyStreamTimer.slnx
      - name: Test Core
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: dotnet test tests/MyStreamTimer.Core.Tests/MyStreamTimer.Core.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Test Store flight selection
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: .\.github\actions\diagnose-partner-center\Test-ResolveStoreFlight.ps1
      - name: Test Store release routing, promotion, and release notes
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: .\scripts\Test-StoreRelease.ps1
      - name: Upload coverage
        if: ${{ always() && needs.changes.outputs.windows == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
      - name: Skipped
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo "No Windows files changed; Core tests skipped."

  build:
    name: Build (Windows, ${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.windows == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Validate change detection
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_CHANGED: ${{ needs.changes.outputs.windows }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || ! "$WINDOWS_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::Windows change detection did not succeed with a valid result."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.windows == 'true' }}
      - uses: actions/setup-dotnet@v5
        if: ${{ needs.changes.outputs.windows == 'true' }}
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-WinAppCli@v0.2
        if: ${{ needs.changes.outputs.windows == 'true' }}
      - name: Restore
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: dotnet restore src/MyStreamTimer.WinUI/MyStreamTimer.WinUI.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -p:PublishReadyToRun=true
      - name: Build
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: dotnet build src/MyStreamTimer.WinUI/MyStreamTimer.WinUI.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --no-restore
      - name: Package (dev-signed)
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          $out = Get-ChildItem -Directory -Path src/MyStreamTimer.WinUI/bin -Recurse | Where-Object { $_.FullName -match 'Release' -and (Test-Path (Join-Path $_.FullName 'MyStreamTimer.exe')) } | Select-Object -First 1
          if (-not $out) { throw "Could not find the Release output folder containing MyStreamTimer.exe." }
          # generate the cert from the *built* manifest so the subject matches the package publisher
          winapp cert generate --manifest (Join-Path $out.FullName 'appxmanifest.xml') --output devcert.pfx --if-exists skip --quiet
          New-Item -ItemType Directory -Force artifacts | Out-Null
          winapp package $out.FullName --cert devcert.pfx --output artifacts/MyStreamTimer-${{ matrix.platform }}.msix --quiet
      - uses: actions/upload-artifact@v7
        if: ${{ needs.changes.outputs.windows == 'true' }}
        with:
          name: msix-${{ matrix.platform }}
          path: artifacts/*.msix
      - name: Validate Store upload runtimes and symbols
        if: ${{ needs.changes.outputs.windows == 'true' && matrix.platform == 'x64' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $pdbTool = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\mspdbcmf.exe' | Select-Object -First 1
          if (-not $pdbTool) { throw "Visual C++ symbol tools (mspdbcmf.exe) are required for Store symbols." }
          dotnet build src/MyStreamTimer.WinUI/MyStreamTimer.WinUI.csproj `
            -c Release -p:Platform=x64 -p:MyStreamTimerStoreBuild=true `
            -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Always `
            -p:AppxBundlePlatforms="x64|ARM64" -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxPackageSigningEnabled=false -p:AppxPackageDir="$pwd\artifacts\store\" `
            "-p:PdbCmfx64ExeFullPath=$pdbTool" `
            -p:SourceRevisionId=${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "Store package build failed." }
          $uploads = @(Get-ChildItem artifacts\store -Recurse -File -Filter *.msixupload)
          if ($uploads.Count -ne 1) { throw "Expected exactly one Store upload package; found $($uploads.Count)." }
          & .\scripts\Test-StorePackage.ps1 -PackagePath $uploads[0].FullName
      - name: Skipped
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo "No Windows files changed; build skipped."

  no-windows-changes:
    name: Build skipped (no Windows changes)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate change detection
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_CHANGED: ${{ needs.changes.outputs.windows }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || ! "$WINDOWS_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::Windows change detection did not succeed with a valid result."
            exit 1
          fi
      - name: Report successful skip
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo "No Windows files changed; skipping the Windows build and tests."
      - name: Report Windows checks ran
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: echo "Windows files changed; the Windows build and tests ran."
