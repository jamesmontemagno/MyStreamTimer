name: Windows Build

# PR / push gate for the Windows (WinUI 3) app. The workflow always runs so the
# required status checks always report; the `changes` job decides whether the
# build and tests actually execute or are skipped (a skipped job still satisfies
# a required check, which keeps docs-only PRs mergeable).

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, 'winui-*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Windows changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            windows:
              - 'src/**'
              - 'tests/**'
              - 'eng/**'
              - 'MyStreamTimer.slnx'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'nuget.config'
              - '.github/workflows/ci.yml'

  test:
    name: Core tests
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MyStreamTimer.slnx
      - name: Test Core
        run: dotnet test tests/MyStreamTimer.Core.Tests/MyStreamTimer.Core.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  build:
    name: Build (Windows, ${{ matrix.platform }})
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-WinAppCli@v0.2
      - name: Restore
        run: dotnet restore src/MyStreamTimer.WinUI/MyStreamTimer.WinUI.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -p:PublishReadyToRun=true
      - name: Build
        run: dotnet build src/MyStreamTimer.WinUI/MyStreamTimer.WinUI.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --no-restore
      - name: Package (dev-signed)
        shell: pwsh
        run: |
          $out = Get-ChildItem -Directory -Path src/MyStreamTimer.WinUI/bin -Recurse | Where-Object { $_.FullName -match 'Release' -and (Test-Path (Join-Path $_.FullName 'MyStreamTimer.exe')) } | Select-Object -First 1
          if (-not $out) { throw "Could not find the Release output folder containing MyStreamTimer.exe." }
          # generate the cert from the *built* manifest so the subject matches the package publisher
          winapp cert generate --manifest (Join-Path $out.FullName 'appxmanifest.xml') --output devcert.pfx --if-exists skip --quiet
          New-Item -ItemType Directory -Force artifacts | Out-Null
          winapp package $out.FullName --cert devcert.pfx --output artifacts/MyStreamTimer-${{ matrix.platform }}.msix --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.platform }}
          path: artifacts/*.msix

  no-windows-changes:
    name: Build skipped (no Windows changes)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Report successful skip
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo "No Windows files changed; skipping the Windows build and tests."
      - name: Report Windows checks ran
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: echo "Windows files changed; the Windows build and tests ran."
