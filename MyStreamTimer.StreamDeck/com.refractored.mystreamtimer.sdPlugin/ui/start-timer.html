<!doctype html>
<html>
  <head lang="en">
    <title>App Timer Start Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Timer">
      <sdpi-select id="target" setting="target" default="countdown">
        <option value="countdown">Countdown 1</option>
        <option value="countdown2">Countdown 2</option>
        <option value="countdown3">Countdown 3</option>
        <option value="countdown4">Countdown 4</option>
        <option value="countup">Count Up 1</option>
        <option value="countup2">Count Up 2</option>
        <option value="time">Current Time</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item id="mode-item" label="Start Mode">
      <sdpi-select id="start-mode" setting="startMode" default="duration">
        <option value="duration">Duration</option>
        <option value="clock-time">Clock Time</option>
        <option value="top-of-hour">Top of Hour</option>
        <option value="current-time">Current Time</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item id="amount-item" label="Duration">
      <sdpi-textfield
        setting="amount"
        type="number"
        min="0.01"
        default="5"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item id="unit-item" label="Unit">
      <sdpi-select setting="unit" default="minutes">
        <option value="minutes">Minutes</option>
        <option value="seconds">Seconds</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item id="clock-item" label="Clock Time">
      <sdpi-textfield
        setting="clockTime"
        type="time"
        default="12:00"
      ></sdpi-textfield>
    </sdpi-item>
    <script src="start-timer.js"></script>
  </body>
</html>
