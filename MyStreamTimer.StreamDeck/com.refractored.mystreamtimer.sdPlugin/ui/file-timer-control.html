<!doctype html>
<html>
  <head lang="en">
    <title>File Timer Control Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Timer Display">
      <sdpi-select
        id="display-format"
        setting="displayFormat"
        default="countdown"
      >
        <option value="countdown">Countdown</option>
        <option value="countup">Count Up</option>
        <option value="current-time">Current Time</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Operation">
      <sdpi-select id="operation" setting="operation" default="pause">
        <option value="pause">Pause</option>
        <option value="resume">Resume</option>
        <option value="reset">Reset</option>
        <option value="stop">Stop</option>
        <option value="start">Start Current Time</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Output Folder">
      <sdpi-textfield
        setting="outputDirectory"
        placeholder="Must match File Timer Start"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="File Name">
      <sdpi-textfield
        setting="fileName"
        default="countdown.txt"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item>
      <sdpi-button id="copy-output-path">Copy output file path</sdpi-button>
    </sdpi-item>
    <sdpi-item>
      <sdpi-alert type="info"
        >The output folder and file name must match the File Timer Start action.
        Current Time supports only Start and Stop.</sdpi-alert
      >
    </sdpi-item>
    <script src="file-timer-control.js"></script>
  </body>
</html>
